# Development stack: database + backend API + frontend.
# Start everything:  docker compose up --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Africa/Dar_es_Salaam
    volumes:
      - amcos_pgdata:/var/lib/postgresql/data   # data survives container removal
    ports:
      - "5432:5432"                              # lets PC tools (pgAdmin, DBeaver) connect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [amcos_net]

  backend:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app                           # live code reload in development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy               # wait until Postgres accepts connections
    networks: [amcos_net]

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000     # service name, not localhost
    volumes:
      - ./frontend:/app
      - /app/node_modules                        # keep the container's own node_modules
    ports:
      - "5173:5173"
    depends_on: [backend]
    networks: [amcos_net]

volumes:
  amcos_pgdata:

networks:
  amcos_net:
